name: brew test-bot

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  guard-kent-prebuilt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Guard kent formula installs prebuilt binaries (no source build)
        run: |
          formula="Formula/kent.rb"
          fail=0
          for marker in 'scripts/build.sh' 'go build' '=> :build' 'system "go"'; do
            if grep -qF -- "${marker}" "${formula}"; then
              echo "ERROR: ${formula} contains source-build marker: ${marker}" >&2
              fail=1
            fi
          done
          if ! grep -qF 'bin.install' "${formula}"; then
            echo "ERROR: ${formula} must install a prebuilt binary (bin.install missing)" >&2
            fail=1
          fi
          if [ "${fail}" -ne 0 ]; then
            echo "kent formula must install prebuilt binaries only" >&2
            exit 1
          fi
          echo "OK: ${formula} installs prebuilt binaries only"

  test-bot:
    strategy:
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, macos-26 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      packages: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      # Equivalent to `brew test-bot --only-tap-syntax` (style + audit) but without
      # `brew readall --os=all --arch=all`. readall requires every formula to
      # resolve a URL for every macOS version, which an arm64-only-on-macOS
      # prebuilt-binary formula (kent ships no Intel-mac artifact; Intel is
      # unsupported) can never satisfy. style + audit still load and validate
      # every formula on each runner.
      - run: brew style respawn-llc/tap

      - run: brew audit --skip-style --tap=respawn-llc/tap

      - name: Base64-encode GITHUB_TOKEN for HOMEBREW_DOCKER_REGISTRY_TOKEN
        id: base64-encode
        if: github.event_name == 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base64_token=$(echo -n "${TOKEN}" | base64 | tr -d "\n")
          echo "::add-mask::${base64_token}"
          echo "token=${base64_token}" >> "${GITHUB_OUTPUT}"

      - run: brew test-bot --only-formulae --root-url=https://ghcr.io/v2/respawn-llc/homebrew-tap
        if: github.event_name == 'pull_request'
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.base64-encode.outputs.token }}

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
